<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pythagon 0.1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg: #ffffff;
    --surface: #f4f4f4;
    --text: #0a0a0a;
    --text-dim: #7a7a7a;
    --border: #dcdcdc;
    --btn-bg: #0a0a0a;
    --btn-text: #ffffff;
    --sidebar-bg: #f4f4f4;
    --scrollbar: #c8c8c8;
  }

  [data-theme="dark"] {
    --bg: #0a0a0a;
    --surface: #151515;
    --text: #eaeaea;
    --text-dim: #8a8a8a;
    --border: #262626;
    --btn-bg: #2563ff;
    --btn-text: #ffffff;
    --sidebar-bg: #101010;
    --scrollbar: #2a2a2a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    overflow: hidden;
  }

  .app {
    display: flex;
    height: 100vh;
    width: 100vw;
    position: relative;
  }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: 260px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 30;
    display: flex;
    flex-direction: column;
    padding: 16px 14px;
  }
  .sidebar.open { transform: translateX(0); }

  .sidebar-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  .sidebar-item {
    font-size: 13px;
    color: var(--text);
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .sidebar-item:hover { background: var(--surface); border-color: var(--border); }

  .sidebar-footer {
    margin-top: auto;
    font-size: 11px;
    color: var(--text-dim);
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 20;
  }
  .overlay.visible { opacity: 1; pointer-events: auto; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
  }
  .icon-btn:hover { background: var(--surface); }
  .icon-btn svg { width: 18px; height: 18px; }

  .topbar-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .theme-toggle {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--text-dim); }

  .log {
    flex: 1;
    overflow-y: auto;
    padding: 24px 18px 12px;
  }

  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
  .log::-webkit-scrollbar-track { background: transparent; }

  .log-inner {
    max-width: 640px;
    margin: 0 auto;
  }

  .msg { margin-bottom: 22px; }
  .msg-tag {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 5px;
  }
  .msg-body {
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.system .msg-body { color: var(--text-dim); font-style: italic; font-size: 13px; }

  .typing-dot {
    display: inline-flex;
    gap: 3px;
    align-items: center;
  }
  .typing-dot span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .typing-dot span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }

  .inputwrap {
    flex-shrink: 0;
    padding: 10px 16px 18px;
  }

  .inputbox {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 8px 8px 10px;
  }

  .plus-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .plus-btn:hover { color: var(--text); border-color: var(--text-dim); }

  .input-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .model-tag {
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 3px;
    letter-spacing: 0.02em;
  }

  #msgInput {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    padding: 2px 0;
    width: 100%;
  }
  #msgInput::placeholder { color: var(--text-dim); }

  #sendBtn {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #sendBtn svg { width: 15px; height: 15px; }
  #sendBtn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<div class="app">
  <div class="overlay" id="overlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-title">PYTHAGON</div>
    <div class="sidebar-item" id="newChatBtn">+ Percakapan baru</div>
    <div class="sidebar-item" id="clearBtn">Hapus riwayat</div>
    <div class="sidebar-footer">model 0.1 — MLP classifier</div>
  </div>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">pythagon / chat</span>
      <button class="theme-toggle" id="themeToggle">MODE</button>
    </div>

    <div class="log" id="log">
      <div class="log-inner" id="logInner">
        <div class="msg system">
          <div class="msg-body">Pythagon 0.1 siap. Ketik pesan di bawah.</div>
        </div>
      </div>
    </div>

    <div class="inputwrap">
      <div class="inputbox">
        <button class="plus-btn" id="plusBtn" aria-label="Tambah" title="Belum ada fitur lampiran">+</button>
        <div class="input-col">
          <div class="model-tag">Pythagon 0.1</div>
          <input type="text" id="msgInput" placeholder="Ketik pesan..." autocomplete="off">
        </div>
        <button id="sendBtn" aria-label="Kirim">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://api.muhmdtamam.my.id/chat';

  const logInner = document.getElementById('logInner');
  const log = document.getElementById('log');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const themeToggle = document.getElementById('themeToggle');
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const newChatBtn = document.getElementById('newChatBtn');
  const clearBtn = document.getElementById('clearBtn');

  let userId = localStorage.getItem('pythagon_user_id');
  if (!userId) {
    userId = 'user_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('pythagon_user_id', userId);
  }

  const savedTheme = localStorage.getItem('pythagon_theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
  } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('pythagon_theme', next);
  });

  function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('visible');
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('visible');
  }
  menuBtn.addEventListener('click', openSidebar);
  overlay.addEventListener('click', closeSidebar);

  function resetChat() {
    logInner.innerHTML = '<div class="msg system"><div class="msg-body">Percakapan baru dimulai.</div></div>';
    closeSidebar();
  }
  newChatBtn.addEventListener('click', resetChat);
  clearBtn.addEventListener('click', resetChat);

  function appendMsg(tag, text, isSystem) {
    const msg = document.createElement('div');
    msg.className = 'msg' + (isSystem ? ' system' : '');
    if (!isSystem) {
      const tagEl = document.createElement('div');
      tagEl.className = 'msg-tag';
      tagEl.textContent = tag;
      msg.appendChild(tagEl);
    }
    const body = document.createElement('div');
    body.className = 'msg-body';
    body.textContent = text;
    msg.appendChild(body);
    logInner.appendChild(msg);
    log.scrollTop = log.scrollHeight;
    return msg;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    appendMsg('YOU', text, false);
    input.value = '';
    sendBtn.disabled = true;

    const waiting = appendMsg('', '', true);
    waiting.innerHTML = '<div class="msg-body"><span class="typing-dot"><span></span><span></span><span></span></span></div>';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, userId }),
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);

      const data = await res.json();
      waiting.remove();
      appendMsg('PYTHAGON', data.reply || '(tidak ada respon)', false);
    } catch (err) {
      waiting.remove();
      appendMsg('', 'Gagal terhubung ke server: ' + err.message, true);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  input.focus();
</script>

</body>
</html>
